* { box-sizing: border-box; }
body { margin: 0; background: #F5F1E8; color: #1E2422; font-family: 'Libre Franklin', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: 'Cormorant Garamond', Garamond, serif; font-weight: 500; margin: 0; letter-spacing: -0.004em; }
a { color: #2E6A60; text-decoration: none; }
a:hover { color: #113C39; }
::selection { background: #113C39; color: #F7F3EA; }
input, textarea, select, button { font-family: inherit; }
input:focus, textarea:focus, select:focus { outline: none; border-color: #2E6A60; }
::-webkit-scrollbar { height: 9px; width: 9px; }
::-webkit-scrollbar-thumb { background: #D9D1BF; border-radius: 100px; }
[hidden] { display: none !important; }

/* hover utilities standing in for the design's style-hover attribute */
.hv-kpi:hover { border-color: #9CBDB2 !important; background: #FDFBF6 !important; }
.hv-dark:hover { background: #0C2C2A !important; }
.hv-outline:hover { border-color: #2E6A60 !important; background: #FBF8F1 !important; }
.hv-danger:hover { border-color: #9A4E36 !important; background: #FBF6F3 !important; }
.hv-teal:hover { background: #113C39 !important; }
.hv-reject:hover { background: #7F3F2B !important; }
.hv-text-teal:hover { color: #2E6A60 !important; }
.hv-fade:hover { opacity: 0.72; }
.hv-row:hover { background: #FDFBF6 !important; }
.hv-thread:hover { background: #FDFBF6 !important; }

#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #F5F1E8; }
#login-screen .card { width: 100%; max-width: 360px; background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 32px; }
#login-screen input { width: 100%; padding: 12px 14px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FBF8F1; font-size: 13.5px; color: #1E2422; }
#login-screen .err { color: #9A4E36; font-size: 13px; margin-top: 10px; }
#app { display: none; }
#app.on { display: block; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="card">
    <div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8375; margin-bottom: 10px;">Marhana &amp; Co</div>
    <h1 style="font-size: 28px; color: #113C39; margin-bottom: 6px;">Admin sign in</h1>
    <p style="font-size: 13px; color: #5C6360; margin: 0 0 20px;">Staff access only. Clients use the portal.</p>
    <form id="login-form">
      <label style="display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 8px;">Email</label>
      <input id="login-email" type="email" required autocomplete="username" style="margin-bottom: 14px;">
      <label style="display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 8px;">Password</label>
      <input id="login-password" type="password" required autocomplete="current-password" style="margin-bottom: 18px;">
      <button type="submit" class="hv-dark" style="width: 100%; padding: 13px; border: none; border-radius: 8px; background: #113C39; color: #F7F3EA; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;">Sign in</button>
      <div id="login-error" class="err"></div>
    </form>
    <p style="margin: 18px 0 0; font-size: 12.5px; text-align: center;"><a href="index.html">&larr; Back to marhanaconsulting.com</a></p>
  </div>
</div>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = 'https://ikpsmsrpiwohuxcajvyp.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_e1_t1R3rm79_ngF0iDJpGA_-O3ASc2V';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var STAGES = ['Opportunity', 'Qualifying', 'Drafting', 'Internal review', 'Submitted', 'Outcome'];
  var WARN = 14;
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var REQ = [
    'Insurance certificates', 'Health & safety policy', 'Accreditations (CHAS, SafeContractor)',
    'Company accounts', 'Method statements', 'Risk assessments', 'Case studies / past projects',
    'Staff CVs', 'Signed contracts', 'Completed bid submissions', 'ID / right to work',
    'Quality certifications (ISO)'
  ];
  var PILL = {
    approved: ['rgba(46,106,96,0.10)', '#2E6A60', 'Approved'],
    pending:  ['rgba(196,148,60,0.16)', '#8A6A22', 'In review'],
    expiring: ['rgba(196,148,60,0.16)', '#8A6A22', 'Expiring'],
    expired:  ['rgba(154,78,54,0.12)', '#9A4E36', 'Expired'],
    missing:  ['#F0EADC', '#8A8375', 'Not supplied']
  };
  var RANK = { expired: 0, pending: 1, expiring: 2, missing: 3, approved: 4 };

  var NOW = new Date();
  var TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());

  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(iso){
    if (!iso) return '';
    var d = new Date(iso.length <= 10 ? iso + 'T00:00:00' : iso);
    return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
  }
  function daysTo(iso){
    if (!iso) return 9999;
    var d = new Date(iso.length <= 10 ? iso + 'T00:00:00' : iso);
    return Math.round((d - TODAY) / 86400000);
  }
  function money(n){ return '£' + Math.round(n||0).toLocaleString('en-GB'); }
  function shortMoney(n){
    n = n || 0;
    if (n >= 1000000) return '£' + (n / 1000000).toFixed(n >= 10000000 ? 0 : 1).replace('.0', '') + 'm';
    if (n >= 1000) return '£' + Math.round(n / 1000) + 'k';
    return '£' + n;
  }
  function whenLabel(at){
    if (!at) return '';
    var d = new Date(at);
    var diff = Math.round((TODAY - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    var time = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (diff <= 0) return time;
    if (diff === 1) return 'Yesterday';
    if (diff < 7) return diff + ' days ago';
    return d.getDate() + ' ' + MON[d.getMonth()];
  }
  function fullStamp(at){
    if (!at) return '';
    var d = new Date(at);
    return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function csvEsc(rows){
    return rows.map(function(r){ return r.map(function(v){
      var s = v === null || v === undefined ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(','); }).join('\n');
  }
  function download(name, text){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
    a.download = name;
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }

  var state = {
    session: null, profile: null,
    screen: 'overview', wide: window.innerWidth >= 900, roomy: (window.innerWidth >= 900 ? window.innerWidth - 360 : window.innerWidth - 36) >= 720,
    clients: [], bids: [], documents: [], messages: [], notes: [], profiles: [],
    docFilter: 'All', docq: '', docClientId: null, rejecting: null, note: '',
    cq: '', clientFilter: 'Active', openClientId: null, edits: {}, inviteDrafts: {}, noteDrafts: {},
    showAdd: false, newClient: { name: '', sector: '', contact: '', email: '' },
    bq: '', bidFilter: 'All open', showNewBid: false, bidView: 'board',
    newBid: { clientId: '', title: '', buyer: '', deadline: '', value: '' },
    mq: '', msgFilter: 'All', threadKey: '', draft: '', toast: '',
    newThread: false, ntClient: '', ntBid: 'general', pendingKey: ''
  };
  var toastTimer = null;

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

  function toast(msg){
    state.toast = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ state.toast = ''; render(); }, 3200);
  }

  // ---------------------------------------------------------------
  // Auth
  // ---------------------------------------------------------------
  function showLogin(){
    $('#login-screen').style.display = 'flex';
    $('#app').classList.remove('on');
  }
  function showApp(){
    $('#login-screen').style.display = 'none';
    $('#app').classList.add('on');
  }

  $('#login-form').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('#login-email').value.trim();
    var password = $('#login-password').value;
    var errEl = $('#login-error');
    errEl.textContent = '';
    var btn = e.target.querySelector('button');
    btn.disabled = true;
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      btn.disabled = false;
      if (res.error) { errEl.textContent = res.error.message; return; }
      afterSignIn(res.data.session);
    });
  });

  function afterSignIn(session){
    state.session = session;
    sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle().then(function(res){
      if (res.error || !res.data || !res.data.is_admin) {
        sb.auth.signOut().then(function(){
          $('#login-error').textContent = 'This account does not have admin access.';
          showLogin();
        });
        return;
      }
      state.profile = res.data;
      showApp();
      loadAll();
    });
  }

  sb.auth.getSession().then(function(res){
    if (res.data.session) afterSignIn(res.data.session);
    else showLogin();
  });

  function signOut(){ sb.auth.signOut().then(function(){ location.reload(); }); }

  // ---------------------------------------------------------------
  // Data loading
  // ---------------------------------------------------------------
  function loadAll(){
    return Promise.all([
      sb.from('clients').select('*').order('created_at', { ascending: false }),
      sb.from('bids').select('*').order('created_at', { ascending: false }),
      sb.from('documents').select('*').not('category', 'is', null),
      sb.from('messages').select('*').order('created_at', { ascending: true }),
      sb.from('client_notes').select('*').order('created_at', { ascending: false }),
      sb.from('profiles').select('*')
    ]).then(function(res){
      var names = ['clients','bids','documents','messages','notes','profiles'];
      var failed = [];
      res.forEach(function(r, i){
        if (r.error) failed.push(names[i] + ': ' + r.error.message);
        else state[names[i]] = r.data || [];
      });
      if (failed.length) toast('Could not load: ' + failed.join('; '));
      render();
    });
  }

  function adminName(){ return (state.profile && state.profile.full_name) || 'Administrator'; }
  function adminInitials(){
    var parts = adminName().split(/\s+/).filter(Boolean);
    return (parts.length > 1 ? parts[0][0] + parts[parts.length - 1][0] : parts[0].slice(0, 2)).toUpperCase();
  }

  function clientById(id){ return state.clients.filter(function(c){ return c.id === id; })[0]; }
  function docsFor(id){ return state.documents.filter(function(d){ return d.client_id === id; }); }
  function approvedCount(id){ return docsFor(id).filter(function(d){ return d.status === 'approved'; }).length; }
  function nameOf(id){ var c = clientById(id); return c ? c.name : ''; }

  function threadsFrom(){
    var map = {};
    state.messages.forEach(function(m){
      var key = m.client_id + '|' + (m.bid_id || 'general');
      if (!map[key]) map[key] = { key: key, clientId: m.client_id, bidId: m.bid_id, items: [] };
      map[key].items.push(m);
    });
    return Object.keys(map).map(function(k){
      var t = map[k];
      t.items.sort(function(a,b){ return new Date(a.created_at) - new Date(b.created_at); });
      t.last = t.items[t.items.length - 1];
      t.unread = t.items.filter(function(m){ return m.from_client && !m.read_at; }).length;
      return t;
    }).sort(function(a,b){ return new Date(b.last.created_at) - new Date(a.last.created_at); });
  }

  function docMeta(d){
    if (d.status === 'missing') return 'Never supplied';
    if (d.expiry_date) {
      var n = daysTo(d.expiry_date);
      return n < 0 ? 'Expired ' + fmtDate(d.expiry_date) + ' · ' + Math.abs(n) + ' days ago' : 'Expires ' + fmtDate(d.expiry_date) + ' · in ' + n + ' days';
    }
    return d.status_changed_at ? 'Uploaded ' + fmtDate(d.status_changed_at) : 'Logged';
  }
  function effectiveStatus(d){
    if (d.status === 'approved' && d.expiry_date) {
      var n = daysTo(d.expiry_date);
      if (n < 0) return 'expired';
      if (n <= WARN) return 'expiring';
    }
    return d.status;
  }
  function docAttention(){
    var out = [];
    state.clients.filter(function(c){ return !c.archived; }).forEach(function(c){
      docsFor(c.id).forEach(function(d){
        var st2 = effectiveStatus(d);
        if (st2 === 'approved') return;
        out.push({ client: c, doc: d, st: st2, sort: RANK[st2] * 1000 + (d.expiry_date ? daysTo(d.expiry_date) : 0) });
      });
    });
    return out.sort(function(a,b){ return a.sort - b.sort; });
  }

  function goDocs(clientId){ state.screen = 'documents'; state.docClientId = clientId || null; state.rejecting = null; render(); }
  function goThread(clientId, bidId){
    var t = threadsFrom().filter(function(x){ return x.clientId === clientId && (bidId ? x.bidId === bidId : true); })[0];
    var key = t ? t.key : clientId + '|' + (bidId || 'general');
    state.screen = 'messages'; state.threadKey = key; state.pendingKey = t ? '' : key; state.newThread = false; state.draft = '';
    render();
  }

  // ---------------------------------------------------------------
  // Mutations
  // ---------------------------------------------------------------
  function reloadAfter(promise){ return promise.then(function(res){ if (res && res.error) toast(res.error.message); return loadAll(); }); }

  function patchClient(id, patch){ return reloadAfter(sb.from('clients').update(patch).eq('id', id)); }
  function moveBid(id, dir){
    var b = state.bids.filter(function(x){ return x.id === id; })[0];
    if (!b) return;
    var next = Math.max(0, Math.min(STAGES.length - 1, b.stage + dir));
    if (next === b.stage) return;
    reloadAfter(sb.from('bids').update({ stage: next }).eq('id', id)).then(function(){ toast(b.title + ' → ' + STAGES[next]); });
  }
  function setDocStatus(clientId, docId, status, extra, msg){
    var patch = Object.assign({ status: status, status_changed_at: new Date().toISOString() }, extra || {});
    reloadAfter(sb.from('documents').update(patch).eq('id', docId)).then(function(){
      state.rejecting = null; state.note = '';
      if (msg) toast(msg);
      render();
    });
  }
  function markThread(key, read){
    var parts = key.split('|');
    var clientId = parts[0], bidId = parts[1] === 'general' ? null : parts[1];
    var unreadRows = state.messages.filter(function(m){
      return m.client_id === clientId && (m.bid_id || null) === bidId && m.from_client && (!!m.read_at) !== read;
    });
    if (!unreadRows.length) return Promise.resolve();
    var q = sb.from('messages').update({ read_at: read ? new Date().toISOString() : null })
      .eq('client_id', clientId).eq('from_client', true);
    q = bidId ? q.eq('bid_id', bidId) : q.is('bid_id', null);
    return reloadAfter(q);
  }
  function sendMessage(){
    var body = state.draft.trim();
    if (!body) { toast('Nothing to send'); return; }
    var parts = state.threadKey.split('|');
    var clientId = parts[0], bidId = parts[1] === 'general' ? null : parts[1];
    reloadAfter(sb.from('messages').insert({
      client_id: clientId, bid_id: bidId, body: body, from_client: false, author: adminName()
    })).then(function(){
      state.draft = '';
      var c = clientById(clientId);
      toast('Sent to ' + (c ? (c.contact_name || c.name) : 'client'));
    });
  }

  // ---------------------------------------------------------------
  // Nav + shell
  // ---------------------------------------------------------------
  function fitScreen(){
    var vw = window.innerWidth;
    var w = vw >= 900;
    var r = (w ? vw - 360 : vw - 36) >= 720;
    if (w !== state.wide || r !== state.roomy) { state.wide = w; state.roomy = r; render(); }
  }
  window.addEventListener('resize', fitScreen);

  function navItems(){
    var threads = threadsFrom();
    var totalUnread = threads.reduce(function(n,t){ return n + t.unread; }, 0);
    var nReview = docAttention().filter(function(r){ return r.st === 'pending'; }).length;
    return [
      { key: 'overview', label: 'Overview', badge: 0 },
      { key: 'clients', label: 'Clients', badge: 0 },
      { key: 'bids', label: 'Bids', badge: 0 },
      { key: 'messages', label: 'Messages', badge: totalUnread },
      { key: 'documents', label: 'Documents', badge: nReview }
    ];
  }

  function renderShell(){
    var nav = navItems();
    var navHtml = nav.map(function(n){
      var active = state.screen === n.key;
      return '<div data-go="'+n.key+'" style="padding: 12px 16px; border-radius: 8px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: '+(active?'#F7F3EA':'transparent')+'; color: '+(active?'#0C2C2A':'#9CBDB2')+'; font-weight: '+(active?'500':'400')+';">' +
        '<span>'+esc(n.label)+'</span>' +
        (n.badge ? '<span style="min-width: 20px; padding: 2px 6px; border-radius: 100px; text-align: center; font-size: 10.5px; background: '+(active?'#113C39':'#2E6A60')+'; color: #F7F3EA;">'+n.badge+'</span>' : '') +
      '</div>';
    }).join('');

    var threads = threadsFrom();
    var totalUnread = threads.reduce(function(n,t){ return n + t.unread; }, 0);
    var dueSoon = state.bids.filter(function(b){ return b.stage < 5 && daysTo(b.deadline) >= 0 && daysTo(b.deadline) <= WARN; }).length;
    var todayLine = dueSoon + ' bids due within ' + WARN + ' days · ' + totalUnread + ' unread messages';

    var sidebar = state.wide
      ? '<aside style="flex: 0 0 264px; background: #0C2C2A; padding: 30px 20px; display: flex; flex-direction: column; gap: 34px; position: sticky; top: 0; height: 100vh;">' +
          '<div style="display: flex; align-items: center; gap: 13px; padding: 0 8px;">' +
            '<img src="logo-mark-t.png" alt="Marhana &amp; Co" style="height: 40px; width: auto;">' +
            '<div style="line-height: 1.2;"><div style="font-family: \'Cormorant Garamond\', serif; font-size: 20px; color: #F7F3EA;">Marhana &amp; Co</div>' +
            '<div style="font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: #9CBDB2;">Admin Console</div></div>' +
          '</div>' +
          '<nav style="display: flex; flex-direction: column; gap: 3px;">'+navHtml+'</nav>' +
          '<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">' +
            '<a href="index.html" style="display:block; padding: 10px 16px; border-radius: 8px; font-size: 12px; color: #7FA79B;">&larr; Back to website</a>' +
            '<div style="padding: 14px 16px; border-radius: 10px; background: rgba(247,243,234,0.05);">' +
              '<div style="font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: #7FA79B; margin-bottom: 8px;">Today</div>' +
              '<div style="font-size: 12.5px; color: #CFE0D8; line-height: 1.55;">'+esc(todayLine)+'</div>' +
            '</div>' +
            '<div style="padding: 16px; border-radius: 10px; background: rgba(247,243,234,0.05); display: flex; align-items: center; gap: 12px;">' +
              '<div style="width: 40px; height: 40px; border-radius: 50%; background: #2E6A60; color: #F7F3EA; display: flex; align-items: center; justify-content: center; font-family: \'Cormorant Garamond\', serif; font-size: 17px; flex: 0 0 auto;">'+esc(adminInitials())+'</div>' +
              '<div style="line-height: 1.3; min-width: 0;"><div style="font-size: 13.5px; color: #F7F3EA;">'+esc(adminName())+'</div>' +
              '<div style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #7FA79B;">Administrator</div></div>' +
            '</div>' +
            '<div data-signout="" style="padding: 10px 16px; border-radius: 8px; font-size: 12px; color: #9CBDB2; cursor: pointer;">Sign out</div>' +
          '</div>' +
        '</aside>'
      : '<div style="background: #0C2C2A; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; z-index: 40;">' +
          '<div style="display: flex; align-items: center; justify-content: space-between; gap: 11px;">' +
            '<div style="display:flex;align-items:center;gap:11px;"><img src="logo-mark-t.png" alt="Marhana &amp; Co" style="height: 30px; width: auto;">' +
            '<div style="font-family: \'Cormorant Garamond\', serif; font-size: 17px; color: #F7F3EA;">Admin Console</div></div>' +
            '<div data-signout="" style="font-size: 11px; color: #9CBDB2; cursor: pointer;">Sign out</div>' +
          '</div>' +
          '<div style="display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px;">' +
            nav.map(function(n){
              var active = state.screen === n.key;
              return '<div data-go="'+n.key+'" style="padding: 9px 14px; border-radius: 100px; font-size: 12.5px; cursor: pointer; white-space: nowrap; background: '+(active?'#F7F3EA':'transparent')+'; color: '+(active?'#0C2C2A':'#9CBDB2')+'; border: 1px solid rgba(247,243,234,0.15);">'+esc(n.label)+(n.badge?' ('+n.badge+')':'')+'</div>';
            }).join('') +
          '</div>' +
        '</div>';

    var body = '';
    if (state.screen === 'overview') body = renderOverview();
    else if (state.screen === 'clients') body = renderClients();
    else if (state.screen === 'bids') body = renderBids();
    else if (state.screen === 'messages') body = renderMessages();
    else if (state.screen === 'documents') body = state.docClientId ? renderDocOne() : renderDocuments();

    return '<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: flex-start;">' +
      sidebar +
      '<main style="flex: 1 1 520px; min-width: 0; padding: '+(state.wide ? '44px 48px 90px' : '28px 20px 70px')+';">'+body+'</main>' +
    '</div>' +
    (state.toast ? '<div style="position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); padding: 15px 26px; border-radius: 10px; background: #0C2C2A; color: #F7F3EA; font-size: 13px; box-shadow: 0 14px 40px rgba(12,44,42,0.28); z-index: 60;">'+esc(state.toast)+'</div>' : '');
  }

  function render(){
    $('#app').innerHTML = renderShell();
    wireEvents();
  }

  // ---------------------------------------------------------------
  // Overview
  // ---------------------------------------------------------------
  function renderOverview(){
    var st = state;
    var threads = threadsFrom();
    var totalUnread = threads.reduce(function(n,t){ return n + t.unread; }, 0);
    var attn = docAttention();
    var nReview = attn.filter(function(r){ return r.st === 'pending'; }).length;
    var nExpired = attn.filter(function(r){ return r.st === 'expired'; }).length;
    var liveClients = st.clients.filter(function(c){ return !c.archived; });
    var dueSoon = st.bids.filter(function(b){ return b.stage < 5 && daysTo(b.deadline) >= 0 && daysTo(b.deadline) <= WARN; });
    var overdueBids = st.bids.filter(function(b){ return b.stage < 5 && daysTo(b.deadline) < 0; });
    var pipelineValue = st.bids.filter(function(b){ return b.stage < 5; }).reduce(function(n,b){ return n + (b.value_gbp||0); }, 0);
    var noClients = st.clients.length === 0;

    var kpis = [
      { label: 'Unread messages', value: totalUnread, fg: totalUnread ? '#113C39' : '#8A8375', go: 'messages' },
      { label: 'Awaiting review', value: nReview, fg: nReview ? '#8A6A22' : '#8A8375', go: 'documents' },
      { label: 'Expired documents', value: nExpired, fg: nExpired ? '#9A4E36' : '#8A8375', go: 'documents' },
      { label: 'Bids due in ' + WARN + ' days', value: dueSoon.length, fg: dueSoon.length ? '#8A6A22' : '#8A8375', go: 'bids' },
      { label: 'Active clients', value: liveClients.length, fg: '#113C39', go: 'clients' },
      { label: 'Live pipeline', value: shortMoney(pipelineValue), fg: '#113C39', go: 'bids' }
    ];
    var kpisHtml = kpis.map(function(k){
      return '<div class="hv-kpi" data-go="'+k.go+'" style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 20px 22px; cursor: pointer;">' +
        '<div style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px; line-height: 1.4;">'+esc(k.label)+'</div>' +
        '<div style="font-family: \'Cormorant Garamond\', serif; font-size: 40px; line-height: 1; color: '+k.fg+';">'+esc(String(k.value))+'</div>' +
      '</div>';
    }).join('');

    var todo = [];
    overdueBids.concat(dueSoon).forEach(function(b){
      var n = daysTo(b.deadline);
      todo.push({ w: n < 0 ? 0 : 2, kind: n < 0 ? 'Overdue bid' : 'Bid deadline',
        kindBg: n < 0 ? 'rgba(154,78,54,0.12)' : 'rgba(196,148,60,0.16)', kindFg: n < 0 ? '#9A4E36' : '#8A6A22',
        title: b.title, sub: nameOf(b.client_id) + ' · ' + STAGES[b.stage] + ' · ' + (n < 0 ? Math.abs(n) + ' days overdue' : n === 0 ? 'due today' : 'due in ' + n + ' days'),
        actionLabel: 'Open bid', go: 'bids' });
    });
    threads.filter(function(t){ return t.unread > 0; }).forEach(function(t){
      var c = clientById(t.clientId);
      var b = t.bidId ? st.bids.filter(function(x){ return x.id === t.bidId; })[0] : null;
      todo.push({ w: 1, kind: 'Message', kindBg: 'rgba(46,106,96,0.10)', kindFg: '#2E6A60',
        title: (c ? c.name : 'Client') + ' — ' + t.unread + ' unread', sub: (b ? b.title : 'General') + ' · ' + whenLabel(t.last.created_at),
        actionLabel: 'Reply', go: 'messages', thread: t });
    });
    attn.slice(0, 8).forEach(function(r){
      var p = PILL[r.st];
      todo.push({ w: r.st === 'expired' ? 0 : r.st === 'pending' ? 2 : 3, kind: p[2], kindBg: p[0], kindFg: p[1],
        title: r.doc.name, sub: r.client.name + ' · ' + docMeta(r.doc), actionLabel: r.st === 'pending' ? 'Review' : 'Open', go: 'documents', clientId: r.client.id });
    });
    todo.sort(function(a,b){ return a.w - b.w; });
    var todoShown = todo.slice(0, 6);

    var todoHtml = todoShown.length
      ? todoShown.map(function(t, i){
          return '<div data-todo="'+i+'" style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 17px 24px; border-top: '+(i===0?'none':'1px solid #F0EADC')+';">' +
            '<span style="flex: 0 0 auto; padding: 6px 11px; border-radius: 100px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: '+t.kindBg+'; color: '+t.kindFg+';">'+esc(t.kind)+'</span>' +
            '<div style="flex: 1 1 300px; min-width: 220px;"><div style="font-size: 14px; color: #113C39; font-weight: 500;">'+esc(t.title)+'</div>' +
            '<div style="font-size: 12px; color: #8A8375; margin-top: 3px;">'+esc(t.sub)+'</div></div>' +
            '<div data-todo-go="'+i+'" class="hv-outline" style="flex: 0 0 auto; margin-left: auto; padding: 9px 17px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">'+esc(t.actionLabel)+'</div>' +
          '</div>';
        }).join('')
      : '<div style="padding: 44px 24px; text-align: center;">' +
          '<div style="font-family: \'Cormorant Garamond\', serif; font-size: 24px; color: #113C39;">'+(noClients?'Nothing to track yet':'All clear')+'</div>' +
          '<div style="font-size: 13px; color: #8A8375; margin-top: 6px;">'+(noClients?'Add a client and their twelve required documents appear automatically.':'No deadlines, unread messages or document issues.')+'</div>' +
        '</div>';

    var stageMax = Math.max.apply(null, [1].concat(STAGES.map(function(s,i){ return st.bids.filter(function(b){ return b.stage === i; }).length; })));
    var stageHtml = STAGES.map(function(s, i){
      var inS = st.bids.filter(function(b){ return b.stage === i; });
      var pct = Math.round(inS.length / stageMax * 100);
      return '<div><div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px;">' +
        '<div style="font-size: 12.5px; color: #1E2422;">'+esc(s)+'</div>' +
        '<div style="font-size: 11.5px; color: #8A8375;">'+inS.length+' · '+shortMoney(inS.reduce(function(n,b){return n+(b.value_gbp||0);},0))+'</div></div>' +
        '<div style="height: 5px; border-radius: 100px; background: #EFE8D8; overflow: hidden;">' +
        '<div style="height: 100%; border-radius: 100px; width: '+pct+'%; background: '+(i===5?'#D9D1BF':'#2E6A60')+';"></div></div></div>';
    }).join('<div style="height:15px;"></div>');

    var activity = st.messages.slice().sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); }).slice(0, 6).map(function(m){
      var c = clientById(m.client_id);
      var b = m.bid_id ? st.bids.filter(function(x){ return x.id === m.bid_id; })[0] : null;
      return { who: m.from_client ? (m.author || (c ? c.name : 'Client')) : 'You',
        what: (m.from_client ? 'wrote in ' : 'replied to ') + (b ? b.title : 'the general thread'),
        sub: (c ? c.name : '') + ' · ' + fullStamp(m.created_at), clientId: m.client_id, bidId: m.bid_id };
    });
    var activityHtml = activity.length ? activity.map(function(a, i){
      return '<div data-activity="'+i+'" class="hv-fade" style="padding: 13px 0; border-bottom: 1px solid #F5F0E5; cursor: pointer;">' +
        '<div style="font-size: 13.5px; color: #1E2422; line-height: 1.5;"><strong style="font-weight: 500; color: #113C39;">'+esc(a.who)+'</strong> '+esc(a.what)+'</div>' +
        '<div style="font-size: 11.5px; color: #8A8375; margin-top: 4px;">'+esc(a.sub)+'</div></div>';
    }).join('') : '<div style="padding: 20px 0; color: #8A8375; font-size: 13px;">Nothing yet.</div>';

    window.__todoShown = todoShown;
    window.__activityList = activity;

    var todayLabel = TODAY.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var overviewSub = noClients
      ? 'No clients yet. Add your first client on the Clients screen — documents, bids and messages all hang off that record.'
      : (todo.length ? todo.length + ' things need you today across ' + liveClients.length + ' active clients.' : 'Nothing outstanding. All clients are up to date.');

    return '<div>' +
      '<div style="margin-bottom: 34px;">' +
        '<div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px;">'+esc(todayLabel)+'</div>' +
        '<h1 style="font-size: 46px; line-height: 1.05; color: #113C39;">Overview</h1>' +
        '<p style="margin: 12px 0 0; font-size: 14.5px; line-height: 1.6; color: #5C6360; max-width: 54ch;">'+esc(overviewSub)+'</p>' +
      '</div>' +
      '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 14px; margin-bottom: 40px;">'+kpisHtml+'</div>' +
      '<div style="margin-bottom: 42px;">' +
        '<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 16px;">' +
          '<h2 style="font-size: 27px; color: #113C39;">Needs you today</h2>' +
          '<div style="font-size: 12.5px; color: #8A8375;">'+(todo.length > 6 ? 'Top 6 of ' + todo.length : todo.length + ' items')+'</div>' +
        '</div>' +
        '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; overflow: hidden;">'+todoHtml+'</div>' +
      '</div>' +
      '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">' +
        '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 24px 26px;">' +
          '<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 20px;">' +
            '<h2 style="font-size: 22px; color: #113C39;">Pipeline</h2>' +
            '<div data-go="bids" style="font-size: 11.5px; color: #2E6A60; cursor: pointer;">All bids &rarr;</div>' +
          '</div>' +
          '<div style="display: flex; flex-direction: column;">'+stageHtml+'</div>' +
        '</div>' +
        '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 24px 26px;">' +
          '<h2 style="font-size: 22px; color: #113C39; margin-bottom: 18px;">Recent activity</h2>' +
          '<div style="display: flex; flex-direction: column;">'+activityHtml+'</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function field(label, id, val, ph){
    return '<label style="display: block;"><span style="display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 8px;">'+label+'</span>' +
      '<input id="'+id+'" value="'+esc(val)+'" placeholder="'+ph+'" style="width: 100%; padding: 12px 14px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FBF8F1; font-size: 13.5px; color: #1E2422;"></label>';
  }
  function smallField(label, id, val){
    return '<label style="display: block;"><span style="display: block; font-size: 11px; color: #8A8375; margin-bottom: 6px;">'+label+'</span>' +
      '<input id="'+id+'" value="'+esc(val)+'" style="width: 100%; padding: 11px 13px; border: 1px solid #E0D8C7; border-radius: 7px; background: #FFFFFF; font-size: 13px; color: #1E2422;"></label>';
  }
  function hasPortal(clientId){ return state.profiles.some(function(p){ return p.client_id === clientId; }); }
  function docsPctAll(clients){
    if (!clients.length) return 0;
    return Math.round(clients.reduce(function(n,c){ return n + approvedCount(c.id) / REQ.length; }, 0) / clients.length * 100);
  }

  // ---------------------------------------------------------------
  // Clients
  // ---------------------------------------------------------------
  function renderClients(){
    var st = state;
    var liveClients = st.clients.filter(function(c){ return !c.archived; });
    var noClients = st.clients.length === 0;

    var addForm = !st.showAdd ? '' : (
      '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 26px 28px; margin-bottom: 30px;">' +
        '<h2 style="font-size: 24px; color: #113C39; margin-bottom: 6px;">New client</h2>' +
        '<p style="margin: 0 0 22px; font-size: 13px; color: #8A8375;">Creates the organisation and their twelve-document checklist.</p>' +
        '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 18px;">' +
          field('Organisation name', 'nc-name', st.newClient.name, 'Ashworth &amp; Vale Ltd') +
          field('Sector', 'nc-sector', st.newClient.sector, 'Facilities management') +
          field('Primary contact', 'nc-contact', st.newClient.contact, 'Alan Vale') +
          field('Email for invite', 'nc-email', st.newClient.email, 'alan@ashworthvale.co.uk') +
        '</div>' +
        '<div style="display: flex; gap: 9px; margin-top: 22px;">' +
          '<div data-save-client="" class="hv-dark" style="padding: 12px 22px; border-radius: 7px; background: #113C39; color: #F7F3EA; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Create client</div>' +
          '<div data-toggle-add="" style="padding: 12px 22px; border-radius: 7px; border: 1px solid #D9D1BF; color: #8A8375; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Cancel</div>' +
        '</div>' +
      '</div>'
    );

    var clientStats = [
      { label: 'Active clients', value: liveClients.length, fg: '#113C39' },
      { label: 'Awaiting invite', value: liveClients.filter(function(c){ return !hasPortal(c.id); }).length, fg: '#8A6A22' },
      { label: 'Open bids', value: st.bids.filter(function(b){ return b.stage < 5; }).length, fg: '#113C39' },
      { label: 'Docs complete', value: docsPctAll(liveClients) + '%', fg: docsPctAll(liveClients) > 85 ? '#2E6A60' : '#8A6A22' }
    ].map(function(s){
      return '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 22px 24px;">' +
        '<div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px;">'+esc(s.label)+'</div>' +
        '<div style="font-family: \'Cormorant Garamond\', serif; font-size: 44px; line-height: 1; color: '+s.fg+';">'+esc(String(s.value))+'</div></div>';
    }).join('');

    var filters = ['Active', 'Needs attention', 'Archived', 'All'].map(function(f){
      var on = st.clientFilter === f;
      return '<div data-cfilter="'+f+'" style="padding: 10px 15px; border-radius: 100px; font-size: 11.5px; cursor: pointer; white-space: nowrap; border: 1px solid '+(on?'#113C39':'#E0D8C7')+'; background: '+(on?'#113C39':'#FFFFFF')+'; color: '+(on?'#F7F3EA':'#5C6360')+';">'+f+'</div>';
    }).join('');

    var cq = st.cq.trim().toLowerCase();
    var rows = st.clients.filter(function(c){
      if (cq && ((c.name||'') + ' ' + (c.sector||'') + ' ' + (c.contact_name||'')).toLowerCase().indexOf(cq) < 0) return false;
      if (st.clientFilter === 'Active') return !c.archived;
      if (st.clientFilter === 'Archived') return c.archived;
      if (st.clientFilter === 'Needs attention') return !c.archived && (approvedCount(c.id) < REQ.length || !hasPortal(c.id));
      return true;
    });

    var rowsHtml = rows.map(function(c){
      var approved = approvedCount(c.id);
      var pct = Math.round(approved / REQ.length * 100);
      var open = st.openClientId === c.id;
      var e = st.edits[c.id] || {};
      var barBg = approved === REQ.length ? '#2E6A60' : approved >= 9 ? '#C4943C' : '#9A4E36';
      var openBids = state.bids.filter(function(b){ return b.client_id === c.id; }).length;
      var html = '<div style="border-top: 1px solid #F0EADC; background: '+(open?'#FDFBF6':'#FFFFFF')+';">' +
        '<div data-toggle-client="'+c.id+'" class="hv-row" style="display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; padding: 17px 24px; cursor: pointer;">' +
          '<div style="flex: 1 1 230px; min-width: 190px;"><div style="font-size: 14.5px; color: #113C39; font-weight: 500;">'+esc(c.name)+'</div>' +
          '<div style="font-size: 12px; color: #8A8375; margin-top: 3px;">'+esc(c.sector||'Unspecified sector')+' · '+esc(c.contact_name||'—')+'</div></div>' +
          '<div style="flex: 1 1 150px; min-width: 140px;"><div style="font-size: 12.5px; color: #1E2422; margin-bottom: 7px;">'+approved+' of '+REQ.length+' approved</div>' +
          '<div style="height: 5px; border-radius: 100px; background: #EFE8D8; overflow: hidden;"><div style="height: 100%; border-radius: 100px; width: '+pct+'%; background: '+barBg+';"></div></div></div>' +
          '<div style="flex: 0 0 auto; min-width: 96px; font-size: 13.5px; color: #1E2422;">'+(st.roomy ? openBids : openBids+' open bids')+'</div>' +
          '<div style="flex: 0 0 auto; min-width: 120px; font-size: 12.5px; color: #8A8375;">'+(st.roomy ? fmtDate(c.created_at) : 'Active '+fmtDate(c.created_at))+'</div>' +
          '<div style="flex: 0 0 auto; margin-left: auto; display: flex; align-items: center; gap: 10px;">' +
            (c.archived ? '<span style="padding: 5px 10px; border-radius: 100px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: #F0EADC; color: #8A8375;">Archived</span>' : '') +
            '<span style="font-size: 18px; color: #9CBDB2; line-height: 1;">'+(open?'⌄':'›')+'</span>' +
          '</div>' +
        '</div>';

      if (open) {
        html += '<div style="padding: 4px 24px 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px;">' +
          '<div style="background: #FBF8F1; border: 1px solid #EFE8D8; border-radius: 12px; padding: 20px 22px;">' +
            '<div style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 16px;">Client details</div>' +
            '<div style="display: grid; gap: 13px;">' +
              smallField('Organisation', 'ea-name-'+c.id, e.name != null ? e.name : c.name) +
              smallField('Sector', 'ea-sector-'+c.id, e.sector != null ? e.sector : (c.sector||'')) +
              smallField('Primary contact', 'ea-contact-'+c.id, e.contact != null ? e.contact : (c.contact_name||'')) +
              smallField('Contact email', 'ea-email-'+c.id, e.email != null ? e.email : (c.contact_email||'')) +
            '</div>' +
            '<div style="display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;">' +
              '<div data-save-details="'+c.id+'" class="hv-dark" style="padding: 11px 18px; border-radius: 7px; background: #113C39; color: #F7F3EA; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Save changes</div>' +
              '<div data-archive="'+c.id+'" class="hv-danger" style="padding: 11px 18px; border-radius: 7px; border: 1px solid #D9D1BF; color: #9A4E36; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">'+(c.archived?'Restore client':'Archive client')+'</div>' +
            '</div>' +
          '</div>' +
          '<div style="display: flex; flex-direction: column; gap: 22px;">' +
            '<div style="background: #FBF8F1; border: 1px solid #EFE8D8; border-radius: 12px; padding: 20px 22px;">' +
              '<div style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 14px;">Portal access</div>' +
              '<div style="font-size: 13px; color: #1E2422; line-height: 1.6; margin-bottom: 14px;">'+(hasPortal(c.id) ? esc(c.contact_email||'This client')+' has portal access.' : 'No portal user yet — send an invite to '+esc(c.contact_name||'them')+'.')+'</div>' +
              '<div style="display: flex; gap: 8px; flex-wrap: wrap;">' +
                '<input id="inv-'+c.id+'" value="'+esc(st.inviteDrafts[c.id] != null ? st.inviteDrafts[c.id] : (c.contact_email||''))+'" placeholder="name@company.co.uk" style="flex: 1 1 180px; min-width: 0; padding: 11px 13px; border: 1px solid #E0D8C7; border-radius: 7px; background: #FFFFFF; font-size: 13px; color: #1E2422;">' +
                '<div data-invite="'+c.id+'" class="hv-teal" style="padding: 11px 18px; border-radius: 7px; background: #2E6A60; color: #F7F3EA; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; white-space: nowrap;">Send invite</div>' +
              '</div>' +
            '</div>' +
            '<div style="background: #FBF8F1; border: 1px solid #EFE8D8; border-radius: 12px; padding: 20px 22px;">' +
              '<div style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 14px;">Internal notes</div>' +
              (st.notes.filter(function(n){return n.client_id===c.id;}).map(function(n){
                return '<div style="padding: 11px 0; border-bottom: 1px solid #EFE8D8;"><div style="font-size: 13px; color: #1E2422; line-height: 1.6;">'+esc(n.body)+'</div>' +
                  '<div style="font-size: 11px; color: #8A8375; margin-top: 5px;">'+esc(n.author||'')+' · '+fmtDate(n.created_at)+'</div></div>';
              }).join('')) +
              '<textarea id="note-'+c.id+'" placeholder="Only your team sees this…" style="width: 100%; min-height: 62px; margin-top: 14px; padding: 12px 13px; border: 1px solid #E0D8C7; border-radius: 7px; background: #FFFFFF; font-size: 13px; line-height: 1.55; color: #1E2422; resize: vertical;">'+esc(st.noteDrafts[c.id]||'')+'</textarea>' +
              '<div data-add-note="'+c.id+'" class="hv-outline" style="display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Add note</div>' +
            '</div>' +
            '<div style="display: flex; gap: 8px; flex-wrap: wrap;">' +
              '<div data-jump="documents:'+c.id+'" class="hv-outline" style="padding: 11px 18px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Documents</div>' +
              '<div data-jump="messages:'+c.id+'" class="hv-outline" style="padding: 11px 18px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Messages</div>' +
              '<div data-jump="bids:'+c.id+'" class="hv-outline" style="padding: 11px 18px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Bids</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }
      html += '</div>';
      return html;
    }).join('');

    var tableHead = st.roomy
      ? '<div style="display: flex; gap: 24px; padding: 13px 24px; background: #FBF8F1; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375;">' +
          '<div style="flex: 1 1 230px; min-width: 190px;">Client</div><div style="flex: 1 1 150px; min-width: 140px;">Documents</div>' +
          '<div style="flex: 0 0 96px;">Open bids</div><div style="flex: 0 0 120px;">Last activity</div><div style="flex: 0 0 auto; min-width: 5px;"></div></div>'
      : '<div style="padding: 13px 24px; background: #FBF8F1; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375;">Client &amp; pipeline status</div>';

    return '<div>' +
      '<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; flex-wrap: wrap; margin-bottom: 34px;">' +
        '<div><div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px;">Accounts</div>' +
        '<h1 style="font-size: 46px; line-height: 1.05; color: #113C39;">Clients</h1>' +
        '<p style="margin: 12px 0 0; font-size: 14.5px; line-height: 1.6; color: #5C6360; max-width: 54ch;">'+(noClients?'No clients yet. Adding one creates their document checklist and portal access.':liveClients.length+' active accounts. Everything here writes to the portal your clients see.')+'</p></div>' +
        '<div style="display: flex; gap: 9px; flex-wrap: wrap;">' +
          '<div data-export-clients="" class="hv-outline" style="padding: 14px 22px; border-radius: 8px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;">Export CSV</div>' +
          '<div data-toggle-add="" class="hv-dark" style="padding: 14px 24px; border-radius: 8px; background: #113C39; color: #F7F3EA; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;">'+(st.showAdd?'Close form':'Add client')+'</div>' +
        '</div>' +
      '</div>' +
      addForm +
      '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 34px;">'+clientStats+'</div>' +
      '<div style="display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 16px;">' +
        '<h2 style="font-size: 27px; color: #113C39;">'+(st.clientFilter === 'All' ? 'All accounts' : st.clientFilter + ' accounts')+'</h2>' +
        '<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">' +
          '<input id="cq" placeholder="Search clients…" value="'+esc(st.cq)+'" style="padding: 11px 15px; width: 220px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FFFFFF; font-size: 13px; color: #1E2422;">' +
          filters +
        '</div>' +
      '</div>' +
      '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; overflow: hidden;">' +
        tableHead + rowsHtml +
        (rows.length === 0 ? '<div style="padding: 46px 24px; text-align: center; border-top: 1px solid #F0EADC;"><div style="font-family: \'Cormorant Garamond\', serif; font-size: 24px; color: #113C39;">No clients here</div><div style="font-size: 13px; color: #8A8375; margin-top: 6px;">Use "Add client" above to create your first account.</div></div>' : '') +
      '</div>' +
    '</div>';
  }

  // ---------------------------------------------------------------
  // Bids
  // ---------------------------------------------------------------
  function dueMeta(b){
    var n = daysTo(b.deadline);
    if (b.stage === 5) return { text: b.outcome || 'Closed', bg: '#F0EADC', fg: '#8A8375', accent: '#D9D1BF' };
    if (n < 0) return { text: 'Overdue', bg: 'rgba(154,78,54,0.12)', fg: '#9A4E36', accent: '#9A4E36' };
    if (n <= WARN) return { text: n === 0 ? 'Due today' : n + ' days left', bg: 'rgba(196,148,60,0.16)', fg: '#8A6A22', accent: '#C4943C' };
    return { text: fmtDate(b.deadline), bg: 'rgba(46,106,96,0.10)', fg: '#2E6A60', accent: '#2E6A60' };
  }

  function renderBids(){
    var st = state;
    var noClients = st.clients.length === 0;
    var liveClients = st.clients.filter(function(c){ return !c.archived; });
    var dueSoon = st.bids.filter(function(b){ return b.stage < 5 && daysTo(b.deadline) <= WARN; });

    var newBidForm = !st.showNewBid ? '' : (
      '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 26px 28px; margin-bottom: 28px;">' +
        '<h2 style="font-size: 24px; color: #113C39; margin-bottom: 20px;">New bid</h2>' +
        '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 18px;">' +
          '<label style="display: block;"><span style="display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 8px;">Client</span>' +
          '<select id="nb-client" style="width: 100%; padding: 12px 14px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FBF8F1; font-size: 13.5px; color: #1E2422;">' +
            liveClients.map(function(c){ return '<option value="'+c.id+'"'+(st.newBid.clientId===c.id?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('') +
          '</select></label>' +
          field('Title', 'nb-title', st.newBid.title, 'Grounds maintenance framework') +
          field('Buyer', 'nb-buyer', st.newBid.buyer, 'Leeds City Council') +
          '<label style="display: block;"><span style="display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 8px;">Deadline</span>' +
          '<input id="nb-deadline" type="date" value="'+esc(st.newBid.deadline)+'" style="width: 100%; padding: 12px 14px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FBF8F1; font-size: 13.5px; color: #1E2422;"></label>' +
          field('Value (£)', 'nb-value', st.newBid.value, '480000') +
        '</div>' +
        '<div style="display: flex; gap: 9px; margin-top: 22px;">' +
          '<div data-save-bid="" class="hv-dark" style="padding: 12px 22px; border-radius: 7px; background: #113C39; color: #F7F3EA; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Add to pipeline</div>' +
          '<div data-toggle-newbid="" style="padding: 12px 22px; border-radius: 7px; border: 1px solid #D9D1BF; color: #8A8375; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Cancel</div>' +
        '</div>' +
      '</div>'
    );

    var bq = st.bq.trim().toLowerCase();
    var bidsFiltered = st.bids.filter(function(b){
      var hay = (b.title + ' ' + (b.buyer||'') + ' ' + nameOf(b.client_id)).toLowerCase();
      if (bq && hay.indexOf(bq) < 0) return false;
      if (st.bidFilter === 'All open') return b.stage < 5;
      if (st.bidFilter === 'Due soon') return b.stage < 5 && daysTo(b.deadline) <= WARN;
      if (st.bidFilter === 'Closed') return b.stage === 5;
      return true;
    });

    function cardHtml(b){
      var dm = dueMeta(b);
      return '<div style="border: 1px solid #EFE8D8; border-left: 3px solid '+dm.accent+'; border-radius: 10px; padding: 13px 14px; background: #FDFBF6;">' +
        '<div style="font-size: 11px; color: #8A8375; margin-bottom: 6px;">'+esc(nameOf(b.client_id))+'</div>' +
        '<div data-open-bid="'+b.id+'" class="hv-text-teal" style="font-size: 13.5px; line-height: 1.4; color: #113C39; cursor: pointer; font-weight: 500;">'+esc(b.title)+'</div>' +
        '<div style="font-size: 11.5px; color: #5C6360; margin-top: 6px;">'+esc(b.buyer||'—')+'</div>' +
        '<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 11px;">' +
          '<span style="padding: 5px 9px; border-radius: 100px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; background: '+dm.bg+'; color: '+dm.fg+';">'+esc(dm.text)+'</span>' +
          '<span style="font-size: 12px; color: #113C39;">'+shortMoney(b.value_gbp)+'</span>' +
        '</div>' +
        '<div style="display: flex; gap: 6px; margin-top: 12px;">' +
          (b.stage > 0 ? '<div data-bid-back="'+b.id+'" class="hv-outline" style="flex: 0 0 34px; text-align: center; padding: 7px 0; border-radius: 6px; border: 1px solid #E0D8C7; color: #8A8375; font-size: 12px; cursor: pointer;">‹</div>' : '') +
          (b.stage < STAGES.length - 1 ? '<div data-bid-fwd="'+b.id+'" class="hv-outline" style="flex: 1 1 auto; text-align: center; padding: 7px 0; border-radius: 6px; border: 1px solid #E0D8C7; color: #2E6A60; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;">Advance</div>' : '<div style="flex: 1 1 auto; text-align: center; padding: 7px 0; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #B3AA97;">Closed</div>') +
        '</div>' +
      '</div>';
    }

    var boardHtml = '<div style="display: flex; gap: 14px; overflow-x: auto; padding-bottom: 14px; align-items: flex-start;">' +
      STAGES.map(function(s, i){
        var inCol = bidsFiltered.filter(function(b){ return b.stage === i; }).sort(function(a,b){ return new Date(a.deadline) - new Date(b.deadline); });
        var sum = inCol.reduce(function(n,b){ return n + (b.value_gbp||0); }, 0);
        return '<div style="flex: 0 0 268px; background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 16px 14px; display: flex; flex-direction: column; gap: 11px;">' +
          '<div style="padding: 0 4px 12px; border-bottom: 1px solid #F0EADC;">' +
            '<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;"><div style="font-size: 12.5px; letter-spacing: 0.06em; color: #113C39; font-weight: 500;">'+esc(s)+'</div>' +
            '<div style="font-size: 11.5px; color: #8A8375;">'+inCol.length+'</div></div>' +
            '<div style="font-size: 11.5px; color: #8A8375; margin-top: 5px;">'+(inCol.length ? shortMoney(sum) + ' combined' : 'No value')+'</div>' +
          '</div>' +
          inCol.map(cardHtml).join('') +
          (inCol.length === 0 ? '<div style="padding: 18px 8px; text-align: center; font-size: 12px; color: #B3AA97;">Nothing here</div>' : '') +
        '</div>';
      }).join('') +
    '</div>';

    var bidList = bidsFiltered.slice().sort(function(a,b){ return new Date(a.deadline) - new Date(b.deadline); });
    var listHtml = '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; overflow: hidden;">' +
      '<div style="display: flex; gap: 20px; padding: 13px 24px; background: #FBF8F1; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375;">' +
        '<div style="flex: 1 1 260px;">Bid</div><div style="flex: 1 1 150px;">Stage</div><div style="flex: 0 0 130px;">Deadline</div><div style="flex: 0 0 100px;">Value</div></div>' +
      bidList.map(function(b){
        var dm = dueMeta(b);
        return '<div style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 16px 24px; border-top: 1px solid #F0EADC;">' +
          '<div style="flex: 1 1 260px; min-width: 200px;"><div data-open-bid="'+b.id+'" class="hv-text-teal" style="font-size: 14px; color: #113C39; cursor: pointer; font-weight: 500;">'+esc(b.title)+'</div>' +
          '<div style="font-size: 11.5px; color: #8A8375; margin-top: 3px;">'+esc(nameOf(b.client_id))+' · '+esc(b.buyer||'—')+'</div></div>' +
          '<div style="flex: 1 1 150px; min-width: 130px;"><span style="padding: 5px 10px; border-radius: 100px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(46,106,96,0.10); color: #2E6A60;">'+esc(STAGES[b.stage])+'</span></div>' +
          '<div style="flex: 0 0 130px; font-size: 12.5px; color: '+dm.fg+';">'+esc(dm.text)+'</div>' +
          '<div style="flex: 0 0 100px; font-size: 13px; color: #113C39;">'+shortMoney(b.value_gbp)+'</div>' +
          (b.stage < STAGES.length - 1 ? '<div data-bid-fwd="'+b.id+'" class="hv-outline" style="flex: 0 0 auto; margin-left: auto; padding: 9px 16px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Advance</div>' : '') +
        '</div>';
      }).join('') +
    '</div>';

    return '<div>' +
      '<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; flex-wrap: wrap; margin-bottom: 30px;">' +
        '<div><div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px;">Pipeline</div>' +
        '<h1 style="font-size: 46px; line-height: 1.05; color: #113C39;">Bids</h1>' +
        '<p style="margin: 12px 0 0; font-size: 14.5px; line-height: 1.6; color: #5C6360; max-width: 54ch;">'+st.bids.filter(function(b){return b.stage<5;}).length+' live bids worth '+money(st.bids.filter(function(b){return b.stage<5;}).reduce(function(n,b){return n+(b.value_gbp||0);},0))+'. '+dueSoon.length+' need attention this fortnight.</p></div>' +
        '<div style="display: flex; gap: 9px; flex-wrap: wrap; align-items: center;">' +
          '<div style="display: flex; border: 1px solid #E0D8C7; border-radius: 8px; overflow: hidden; background: #FFFFFF;">' +
            ['board','list'].map(function(v){ var on = st.bidView===v; return '<div data-bidview="'+v+'" style="padding: 12px 18px; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; background: '+(on?'#113C39':'#FFFFFF')+'; color: '+(on?'#F7F3EA':'#5C6360')+';">'+(v==='board'?'Board':'List')+'</div>'; }).join('') +
          '</div>' +
          '<div data-export-bids="" class="hv-outline" style="padding: 14px 22px; border-radius: 8px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;">Export CSV</div>' +
          '<div data-toggle-newbid="" class="hv-dark" style="padding: 14px 24px; border-radius: 8px; background: #113C39; color: #F7F3EA; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;">'+(st.showNewBid?'Close form':'New bid')+'</div>' +
        '</div>' +
      '</div>' +
      newBidForm +
      '<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">' +
        '<input id="bq" placeholder="Search bids, buyers, clients…" value="'+esc(st.bq)+'" style="padding: 11px 15px; width: 260px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FFFFFF; font-size: 13px; color: #1E2422;">' +
        ['All open','Due soon','Closed','Everything'].map(function(f){ var on = st.bidFilter===f; return '<div data-bfilter="'+f+'" style="padding: 10px 15px; border-radius: 100px; font-size: 11.5px; cursor: pointer; white-space: nowrap; border: 1px solid '+(on?'#113C39':'#E0D8C7')+'; background: '+(on?'#113C39':'#FFFFFF')+'; color: '+(on?'#F7F3EA':'#5C6360')+';">'+f+'</div>'; }).join('') +
      '</div>' +
      (bidsFiltered.length === 0 ? '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 54px 24px; text-align: center; margin-bottom: 22px;"><div style="font-family: \'Cormorant Garamond\', serif; font-size: 26px; color: #113C39;">'+(noClients?'No clients yet':(st.bids.length?'Nothing matches that filter':'No bids in the pipeline'))+'</div><div style="font-size: 13.5px; color: #8A8375; margin-top: 7px;">'+(noClients?'Add a client first, then their bids can be tracked here.':(st.bids.length?'Try another filter or clear the search.':'Use "New bid" to add the first opportunity.'))+'</div></div>' : '') +
      (st.bidView === 'board' ? boardHtml : listHtml) +
    '</div>';
  }

  // ---------------------------------------------------------------
  // Messages
  // ---------------------------------------------------------------
  function labelFor(t){
    if (!t.bidId) return 'General';
    var b = state.bids.filter(function(x){ return x.id === t.bidId; })[0];
    return b ? b.title : 'Bid thread';
  }

  function renderMessages(){
    var st = state;
    var noClients = st.clients.length === 0;
    var threads = threadsFrom();
    var totalUnread = threads.reduce(function(n,t){ return n + t.unread; }, 0);

    var newThreadForm = !st.newThread ? '' : (function(){
      var liveClients = st.clients.filter(function(c){ return !c.archived; });
      var ntBidOptions = [{ id: 'general', name: 'General thread' }].concat(
        st.bids.filter(function(b){ return b.client_id === st.ntClient; }).map(function(b){ return { id: b.id, name: b.title }; })
      );
      return '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 24px 26px; margin-bottom: 22px;">' +
        '<h2 style="font-size: 22px; color: #113C39; margin-bottom: 18px;">Start a conversation</h2>' +
        '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 18px;">' +
          '<label style="display: block;"><span style="display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 8px;">Client</span>' +
          '<select id="nt-client" style="width: 100%; padding: 12px 14px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FBF8F1; font-size: 13.5px; color: #1E2422;">' +
            liveClients.map(function(c){ return '<option value="'+c.id+'"'+(st.ntClient===c.id?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('') +
          '</select></label>' +
          '<label style="display: block;"><span style="display: block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 8px;">Thread</span>' +
          '<select id="nt-bid" style="width: 100%; padding: 12px 14px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FBF8F1; font-size: 13.5px; color: #1E2422;">' +
            ntBidOptions.map(function(o){ return '<option value="'+o.id+'"'+(st.ntBid===o.id?' selected':'')+'>'+esc(o.name)+'</option>'; }).join('') +
          '</select></label>' +
        '</div>' +
        '<div data-start-thread="" class="hv-dark" style="display: inline-block; margin-top: 20px; padding: 12px 22px; border-radius: 7px; background: #113C39; color: #F7F3EA; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Open thread</div>' +
      '</div>';
    })();

    var mq = st.mq.trim().toLowerCase();
    var threadRows = threads.filter(function(t){
      var c = clientById(t.clientId);
      var hay = ((c?c.name:'') + ' ' + labelFor(t) + ' ' + t.last.body).toLowerCase();
      if (mq && hay.indexOf(mq) < 0) return false;
      if (st.msgFilter === 'Unread') return t.unread > 0;
      if (st.msgFilter === 'Bid threads') return !!t.bidId;
      return true;
    });

    var threadListHtml = threadRows.length ? threadRows.map(function(t){
      var c = clientById(t.clientId);
      var sel = st.threadKey === t.key;
      return '<div data-pick-thread="'+t.key+'" class="hv-thread" style="padding: 15px 16px; border-bottom: 1px solid #F5F0E5; cursor: pointer; background: '+(sel?'#FBF8F1':'#FFFFFF')+'; border-left: 3px solid '+(sel?'#113C39':'transparent')+';">' +
        '<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">' +
          '<div style="font-size: 13.5px; color: #113C39; font-weight: '+(t.unread?'600':'400')+'; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">'+esc(c?c.name:'Unknown client')+'</div>' +
          '<div style="font-size: 11px; color: #8A8375; flex: 0 0 auto;">'+whenLabel(t.last.created_at)+'</div>' +
        '</div>' +
        '<div style="font-size: 11px; color: #2E6A60; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">'+esc(labelFor(t))+'</div>' +
        '<div style="display: flex; align-items: center; gap: 8px; margin-top: 7px;">' +
          '<div style="font-size: 12px; color: #8A8375; line-height: 1.45; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">'+(t.last.from_client?'':'You: ')+esc(t.last.body)+'</div>' +
          (t.unread ? '<span style="flex: 0 0 auto; min-width: 19px; padding: 2px 6px; border-radius: 100px; text-align: center; font-size: 10.5px; background: #113C39; color: #F7F3EA;">'+t.unread+'</span>' : '') +
        '</div>' +
      '</div>';
    }).join('') : '<div style="padding: 38px 18px; text-align: center;"><div style="font-size: 13.5px; color: #113C39;">'+(noClients?'No clients yet':(st.messages.length?'Nothing matches':'No conversations yet'))+'</div><div style="font-size: 12px; color: #8A8375; margin-top: 6px; line-height: 1.5;">'+(noClients?'Add a client, then start a thread here.':(st.messages.length?'Try another filter or search.':'Use "New message" to write to a client.'))+'</div></div>';

    var openT = threads.filter(function(t){ return t.key === st.threadKey; })[0];
    if (!openT && st.pendingKey && st.pendingKey === st.threadKey) {
      var p = st.pendingKey.split('|');
      if (clientById(p[0])) openT = { key: st.pendingKey, clientId: p[0], bidId: p[1]==='general'?null:p[1], items: [], unread: 0, last: null };
    }
    var openC = openT ? clientById(openT.clientId) : null;
    var openMsgs = !openT ? [] : openT.items.map(function(m){
      return { body: m.body, align: m.from_client ? 'flex-start' : 'flex-end', textAlign: m.from_client ? 'left' : 'right',
        bg: m.from_client ? '#FFFFFF' : '#113C39', fg: m.from_client ? '#1E2422' : '#F7F3EA', bd: m.from_client ? '#EFE8D8' : '#113C39',
        meta: (m.author || (m.from_client ? (openC?openC.name:'Client') : 'Us')) + ' · ' + fullStamp(m.created_at) };
    });

    var rightPane = !openT
      ? '<div style="min-height: 420px; display: flex; align-items: center; justify-content: center; padding: 40px; text-align: center;"><div><h2 style="font-size: 24px; color: #113C39; margin-bottom: 8px;">No thread selected</h2><p style="margin: 0; font-size: 13.5px; color: #8A8375;">Pick a conversation on the left.</p></div></div>'
      : '<div style="display: flex; flex-direction: column; min-height: 520px;">' +
          '<div style="padding: 18px 22px; border-bottom: 1px solid #F0EADC; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">' +
            '<div><div style="font-size: 17px; font-family: \'Cormorant Garamond\', serif; color: #113C39;">'+esc(openC?openC.name:'')+'</div>' +
            '<div style="font-size: 11.5px; color: #8A8375; margin-top: 3px;">'+esc(labelFor(openT))+(openC?' · '+esc(openC.contact_name||''):'')+'</div></div>' +
            '<div style="display: flex; gap: 8px; flex-wrap: wrap;">' +
              (openT.bidId ? '<div data-open-bid-from-thread="'+openT.bidId+'" class="hv-outline" style="padding: 9px 15px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">View bid</div>' : '') +
              '<div data-toggle-thread-read="" class="hv-outline" style="padding: 9px 15px; border-radius: 7px; border: 1px solid #D9D1BF; color: #8A8375; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">'+(openT.unread?'Mark read':'Mark unread')+'</div>' +
            '</div>' +
          '</div>' +
          '<div style="flex: 1 1 auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 460px; background: #FDFBF6;">' +
            (openMsgs.length ? openMsgs.map(function(m){
              return '<div style="display: flex; justify-content: '+m.align+';"><div style="max-width: 74%;">' +
                '<div style="padding: 13px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; background: '+m.bg+'; color: '+m.fg+'; border: 1px solid '+m.bd+'; white-space: pre-wrap;">'+esc(m.body)+'</div>' +
                '<div style="font-size: 10.5px; color: #8A8375; margin-top: 5px; text-align: '+m.textAlign+';">'+esc(m.meta)+'</div></div></div>';
            }).join('') : '') +
          '</div>' +
          '<div style="padding: 16px 22px 20px; border-top: 1px solid #F0EADC; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;">' +
            '<textarea id="draft" placeholder="Write a reply…  (⌘↵ to send)" style="flex: 1 1 240px; min-width: 0; min-height: 76px; padding: 13px 15px; border: 1px solid #E0D8C7; border-radius: 9px; background: #FBF8F1; font-size: 13.5px; line-height: 1.55; color: #1E2422; resize: vertical;">'+esc(st.draft)+'</textarea>' +
            '<div data-send-msg="" class="hv-dark" style="padding: 14px 26px; border-radius: 8px; background: #113C39; color: #F7F3EA; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Send</div>' +
          '</div>' +
        '</div>';

    return '<div>' +

        '<div><div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px;">Correspondence</div>' +
        '<h1 style="font-size: 46px; line-height: 1.05; color: #113C39;">Messages</h1>' +
        '<p style="margin: 12px 0 0; font-size: 14.5px; line-height: 1.6; color: #5C6360; max-width: 54ch;">'+(noClients?'One thread per bid, plus a general thread per client. Add a client to start writing.':(totalUnread?totalUnread+' unread across '+threads.length+' threads. Replies appear in the client portal.':'All threads read. Replies appear in the client portal.'))+'</p></div>' +
        '<div style="display: flex; gap: 9px; flex-wrap: wrap;">' +
          '<div data-mark-all-read="" class="hv-outline" style="padding: 14px 22px; border-radius: 8px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;">Mark all read</div>' +

          '<div style="padding: 14px 16px; border-bottom: 1px solid #F0EADC;">' +
            '<input id="mq" placeholder="Search threads…" value="'+esc(st.mq)+'" style="width: 100%; padding: 10px 13px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FBF8F1; font-size: 13px; color: #1E2422;">' +
            '<div style="display: flex; gap: 6px; margin-top: 11px;">' +

      '</div>' +

  // ---------------------------------------------------------------
  // Documents (all clients)
  // ---------------------------------------------------------------
  function renderDocuments(){
    var st = state;
    var noClients = st.clients.length === 0;
    var liveClients = st.clients.filter(function(c){ return !c.archived; });
    var attn = docAttention();
    var nReview = attn.filter(function(r){ return r.st === 'pending'; }).length;
    var nExpired = attn.filter(function(r){ return r.st === 'expired'; }).length;
    var nExpiring = attn.filter(function(r){ return r.st === 'expiring'; }).length;
    var nMissing = attn.filter(function(r){ return r.st === 'missing'; }).length;

    var docStats = [
      { label: 'Awaiting review', value: nReview, fg: '#8A6A22' },
      { label: 'Expired', value: nExpired, fg: '#9A4E36' },
      { label: 'Expiring in ' + WARN + ' days', value: nExpiring, fg: '#8A6A22' },
      { label: 'Not supplied', value: nMissing, fg: '#8A8375' },
      { label: 'Fully compliant', value: liveClients.filter(function(c){return approvedCount(c.id)===REQ.length;}).length + ' / ' + liveClients.length, fg: '#113C39' }
    ].map(function(s){
      return '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; padding: 20px 22px;">' +
        '<div style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px; line-height: 1.4;">'+esc(s.label)+'</div>' +
        '<div style="font-family: \'Cormorant Garamond\', serif; font-size: 42px; line-height: 1; color: '+s.fg+';">'+esc(String(s.value))+'</div></div>';
    }).join('');

    var attnRows = attn.slice(0, 6).map(function(r){
      var p = PILL[r.st];
      var primaryLabel = r.st === 'pending' ? 'Review' : 'Chase';
      return '<div style="display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding: 17px 24px; border-top: 1px solid #F0EADC;">' +
        '<div style="flex: 1 1 200px; min-width: 180px;"><div data-goto-doc-client="'+r.client.id+'" class="hv-text-teal" style="font-size: 14px; color: #113C39; cursor: pointer; font-weight: 500;">'+esc(r.client.name)+'</div>' +
        '<div style="font-size: 12px; color: #8A8375; margin-top: 3px;">'+esc(r.client.contact_name||'')+'</div></div>' +
        '<div style="flex: 1 1 220px; min-width: 190px;"><div style="font-size: 13.5px; color: #1E2422;">'+esc(r.doc.name)+'</div>' +
        '<div style="font-size: 11.5px; color: #8A8375; margin-top: 3px; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">'+(r.doc.status==='missing'?'Awaiting upload':slug(r.doc.name)+'-2026.pdf')+'</div></div>' +
        '<div style="flex: 0 0 auto; min-width: 118px;"><span style="display: inline-block; padding: 6px 11px; border-radius: 100px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; background: '+p[0]+'; color: '+p[1]+';">'+p[2]+'</span>' +
        '<div style="font-size: 11.5px; color: #8A8375; margin-top: 6px;">'+(r.doc.expiry_date?fmtDate(r.doc.expiry_date):(r.doc.status==='pending'?'Logged '+fmtDate(r.doc.status_changed_at):'No date'))+'</div></div>' +
        '<div style="display: flex; gap: 8px; justify-content: flex-end; flex: 0 0 auto; margin-left: auto;">' +
          '<div data-attn-primary="'+r.doc.id+'" data-attn-client="'+r.client.id+'" data-attn-kind="'+(r.st==='pending'?'review':'chase')+'" class="hv-dark" style="padding: 9px 16px; border-radius: 7px; background: #113C39; color: #F7F3EA; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">'+primaryLabel+'</div>' +
          '<div data-goto-doc-client="'+r.client.id+'" class="hv-outline" style="padding: 9px 16px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Open</div>' +
        '</div>' +
      '</div>';
    }).join('');

    var docq = st.docq.trim().toLowerCase();
    var docRows = liveClients.filter(function(c){
      if (docq && ((c.name||'')+' '+(c.sector||'')).toLowerCase().indexOf(docq) < 0) return false;
      var ds = docsFor(c.id);
      if (st.docFilter === 'Needs review') return ds.some(function(d){ return d.status === 'pending'; });
      if (st.docFilter === 'At risk') return ds.some(function(d){ var e = effectiveStatus(d); return e==='expired'||e==='expiring'||e==='missing'; });
      if (st.docFilter === 'Complete') return approvedCount(c.id) === REQ.length;
      return true;
    }).map(function(c){
      var ds = docsFor(c.id);
      var approved = approvedCount(c.id);
      var ok = approved === REQ.length;
      var worst = ds.slice().sort(function(x,y){ return RANK[effectiveStatus(x)] - RANK[effectiveStatus(y)]; })[0];
      var bad = ds.some(function(d){ return effectiveStatus(d) === 'expired'; });
      return { name: c.name, id: c.id, sector: c.sector, ratio: approved+' of '+REQ.length+' approved',
        pct: Math.round(approved/REQ.length*100), barBg: ok?'#2E6A60':(bad?'#9A4E36':'#C4943C'),
        issue: (ok || !worst) ? 'Nothing outstanding' : worst.name + ' — ' + PILL[effectiveStatus(worst)][2].toLowerCase(),
        issueFg: ok ? '#8A8375' : (bad ? '#9A4E36' : '#5C6360') };
