    var docRowsHtml = docRows.map(function(c){
      return '<div style="display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding: 17px 24px; border-top: 1px solid #F0EADC;">' +
        '<div style="flex: 1 1 220px; min-width: 190px;"><div style="font-size: 14.5px; color: #113C39; font-weight: 500;">'+esc(c.name)+'</div>' +
        '<div style="font-size: 12px; color: #8A8375; margin-top: 3px;">'+esc(c.sector||'Unspecified sector')+'</div></div>' +
        '<div style="flex: 1 1 150px; min-width: 140px;"><div style="font-size: 12.5px; color: #1E2422; margin-bottom: 7px;">'+c.ratio+'</div>' +
        '<div style="height: 5px; border-radius: 100px; background: #EFE8D8; overflow: hidden;"><div style="height: 100%; border-radius: 100px; width: '+c.pct+'%; background: '+c.barBg+';"></div></div></div>' +
        '<div style="font-size: 13px; color: '+c.issueFg+'; flex: 1 1 180px; min-width: 160px;">'+esc(c.issue)+'</div>' +
        '<div data-goto-doc-client="'+c.id+'" class="hv-outline" style="flex: 0 0 auto; margin-left: auto; padding: 9px 18px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Review</div>' +
      '</div>';
    }).join('');

    return '<div>' +
      '<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; flex-wrap: wrap; margin-bottom: 34px;">' +
        '<div><div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px;">Compliance</div>' +
        '<h1 style="font-size: 46px; line-height: 1.05; color: #113C39;">Documents</h1>' +
        '<p style="margin: 12px 0 0; font-size: 14.5px; line-height: 1.6; color: #5C6360; max-width: 54ch;">'+(noClients?'Twelve documents are required from every client. Add a client to start their checklist.':'Twelve documents are required from every client. '+attn.length+' items need action.')+'</p></div>' +
        '<div data-chase-all="" class="hv-dark" style="padding: 14px 24px; border-radius: 8px; background: #113C39; color: #F7F3EA; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;">Chase outstanding</div>' +
      '</div>' +
      '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 14px; margin-bottom: 42px;">'+docStats+'</div>' +
      '<div style="margin-bottom: 44px;">' +
        '<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 16px;">' +
          '<h2 style="font-size: 27px; color: #113C39;">Needs your attention</h2>' +
          '<div style="font-size: 12.5px; color: #8A8375;">'+(attn.length>6?'Top 6 of '+attn.length+', soonest first':attn.length+' items, soonest first')+'</div>' +
        '</div>' +
        '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; overflow: hidden;">' + attnRows +
          (attn.length === 0 ? '<div style="padding: 40px 24px; text-align: center; border-top: 1px solid #F0EADC;"><div style="font-size: 13.5px; color: #113C39;">'+(noClients?'No clients yet':'Nothing outstanding')+'</div><div style="font-size: 12.5px; color: #8A8375; margin-top: 6px;">'+(noClients?'Document checklists are created with each client.':'Every required document is approved and in date.')+'</div></div>' : '') +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div style="display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 16px;">' +
          '<h2 style="font-size: 27px; color: #113C39;">All clients</h2>' +
          '<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">' +
            '<input id="docq" placeholder="Search clients…" value="'+esc(st.docq)+'" style="padding: 11px 15px; width: 220px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FFFFFF; font-size: 13px; color: #1E2422;">' +
            ['All','Needs review','At risk','Complete'].map(function(f){ var on = st.docFilter===f; return '<div data-dfilter="'+f+'" style="padding: 10px 15px; border-radius: 100px; font-size: 11.5px; cursor: pointer; white-space: nowrap; border: 1px solid '+(on?'#113C39':'#E0D8C7')+'; background: '+(on?'#113C39':'#FFFFFF')+'; color: '+(on?'#F7F3EA':'#5C6360')+';">'+f+'</div>'; }).join('') +
          '</div>' +
        '</div>' +
        '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; overflow: hidden;">' +
          '<div style="padding: 13px 24px; background: #FBF8F1; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375;">Client &amp; document status</div>' +
          docRowsHtml +
          (docRows.length === 0 ? '<div style="padding: 42px 24px; text-align: center; border-top: 1px solid #F0EADC;"><div style="font-size: 13.5px; color: #113C39;">No clients to show</div><div style="font-size: 12.5px; color: #8A8375; margin-top: 6px;">Add a client and their twelve required documents appear here.</div></div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // ---------------------------------------------------------------
  // Documents — single client detail
  // ---------------------------------------------------------------
  function renderDocOne(){
    var st = state;
    var docOne = clientById(st.docClientId);
    if (!docOne) { state.docClientId = null; return renderDocuments(); }
    var ds = docsFor(docOne.id);
    var approved = approvedCount(docOne.id);
    var pct = Math.round(approved / REQ.length * 100);

    var rows = ds.slice().sort(function(x,y){ return RANK[effectiveStatus(x)] - RANK[effectiveStatus(y)]; }).map(function(d){
      var eff = effectiveStatus(d);
      var p = PILL[eff];
      var canReview = d.status === 'pending';
      var canReceive = d.status === 'missing' || eff === 'expired';
      var canChase = d.status === 'missing' || eff === 'expired' || eff === 'expiring';
      var canView = d.status === 'approved';
      var file = d.status === 'missing' ? '—' : slug(d.name) + '-2026.pdf';
      var actions = '';
      if (canReview) actions += '<div data-doc-approve="'+d.id+'" class="hv-dark" style="padding: 9px 16px; border-radius: 7px; background: #113C39; color: #F7F3EA; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Approve</div>' +
        '<div data-doc-reject="'+d.id+'" class="hv-danger" style="padding: 9px 16px; border-radius: 7px; border: 1px solid #D9D1BF; color: #9A4E36; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Reject</div>';
      if (canReceive) actions += '<div data-doc-receive="'+d.id+'" class="hv-teal" style="padding: 9px 16px; border-radius: 7px; background: #2E6A60; color: #F7F3EA; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">'+(eff==='expired'?'Renewal received':'Mark received')+'</div>';
      if (canChase) actions += '<div data-doc-chase="'+d.id+'" class="hv-outline" style="padding: 9px 16px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">'+(d.status==='missing'?'Request':'Chase renewal')+'</div>';
      if (canView) actions += '<div data-doc-view="'+d.id+'" class="hv-outline" style="padding: 9px 16px; border-radius: 7px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">View</div>';

      var rejectBox = st.rejecting === d.id
        ? '<div style="padding: 0 24px 20px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap;">' +
            '<textarea id="reject-note" placeholder="Tell them what\'s wrong with it…" style="flex: 1 1 240px; min-width: 0; min-height: 74px; padding: 13px 15px; border: 1px solid #E0D8C7; border-radius: 8px; background: #FBF8F1; font-size: 13px; line-height: 1.55; color: #1E2422; resize: vertical;">'+esc(st.note)+'</textarea>' +
            '<div style="display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto;">' +
              '<div data-doc-confirm-reject="'+d.id+'" class="hv-reject" style="padding: 11px 20px; border-radius: 7px; background: #9A4E36; color: #F7F3EA; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-align: center;">Send</div>' +
              '<div data-doc-cancel-reject="" style="padding: 11px 20px; border-radius: 7px; border: 1px solid #D9D1BF; color: #8A8375; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; text-align: center;">Cancel</div>' +
            '</div>' +
          '</div>'
        : '';

      return '<div style="border-top: 1px solid #F0EADC;">' +
        '<div style="display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding: 16px 24px;">' +
          '<div style="flex: 1 1 240px; min-width: 200px;"><div style="font-size: 14px; color: #113C39;">'+esc(d.name)+'</div>' +
          '<div style="font-size: 11.5px; color: #8A8375; margin-top: 3px;">'+esc(docMeta(d))+'</div></div>' +
          '<div style="font-size: 12px; color: #5C6360; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 150px; min-width: 0;">'+file+'</div>' +
          '<div style="flex: 0 0 auto; min-width: 118px;"><span style="display: inline-block; padding: 6px 11px; border-radius: 100px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; background: '+p[0]+'; color: '+p[1]+';">'+p[2]+'</span></div>' +
          '<div style="display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; flex: 0 0 auto; margin-left: auto;">'+actions+'</div>' +
        '</div>' + rejectBox +
      '</div>';
    }).join('');

    return '<div>' +
      '<div data-back-to-docs="" class="hv-text-teal" style="font-size: 12.5px; color: #2E6A60; cursor: pointer; margin-bottom: 24px;">&larr; All clients</div>' +
      '<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 36px; flex-wrap: wrap; margin-bottom: 36px;">' +
        '<div><div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8375; margin-bottom: 12px;">'+esc(docOne.sector||'Unspecified sector')+'</div>' +
        '<h1 style="font-size: 42px; line-height: 1.08; color: #113C39;">'+esc(docOne.name)+'</h1>' +
        '<p style="margin: 12px 0 0; font-size: 14px; color: #5C6360;">'+esc(docOne.contact_name||'')+' · primary contact</p></div>' +
        '<div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">' +
          '<div style="width: 118px; height: 118px; border-radius: 50%; background: conic-gradient(#9CBDB2 '+Math.round(pct*3.6)+'deg, #EFE8D8 0); display: flex; align-items: center; justify-content: center;">' +
            '<div style="width: 90px; height: 90px; border-radius: 50%; background: #113C39; display: flex; flex-direction: column; align-items: center; justify-content: center;">' +
              '<div style="font-family: \'Cormorant Garamond\', serif; font-size: 32px; line-height: 1; color: #F7F3EA;">'+pct+'%</div>' +
              '<div style="font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: #9CBDB2; margin-top: 4px;">Complete</div>' +
            '</div>' +
          '</div>' +
          '<div style="display: flex; flex-direction: column; gap: 9px;">' +
            '<div data-request-missing="'+docOne.id+'" class="hv-dark" style="padding: 13px 22px; border-radius: 8px; background: #113C39; color: #F7F3EA; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; text-align: center;">Request missing</div>' +
            '<div data-doc-message="'+docOne.id+'" class="hv-outline" style="padding: 13px 22px; border-radius: 8px; border: 1px solid #D9D1BF; color: #2E6A60; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; text-align: center;">Message client</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div style="background: #FFFFFF; border: 1px solid #E9E1D0; border-radius: 14px; overflow: hidden;">' +
        '<div style="padding: 13px 24px; background: #FBF8F1; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8375;">Required documents &amp; status</div>' +
        rows +
      '</div>' +
    '</div>';
  }

  // ---------------------------------------------------------------
  // Live-search inputs: update state + re-render without losing
  // focus or cursor position.
  // ---------------------------------------------------------------
  function liveSearch(id, stateKey){
    var el = $('#'+id);
    if (!el) return;
    el.addEventListener('input', function(){
      state[stateKey] = el.value;
      var pos = el.selectionStart;
      render();
      var again = $('#'+id);
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
    });
  }

  // ---------------------------------------------------------------
  // Event wiring — re-run after every render()
  // ---------------------------------------------------------------
  function wireEvents(){
    $all('[data-signout]').forEach(function(el){ el.addEventListener('click', signOut); });

    $all('[data-go]').forEach(function(el){
      el.addEventListener('click', function(){ state.screen = el.getAttribute('data-go'); render(); });
    });

    $all('[data-todo-go]').forEach(function(el){
      el.addEventListener('click', function(){
        var t = (window.__todoShown || [])[parseInt(el.getAttribute('data-todo-go'), 10)];
        if (!t) return;
        if (t.thread) goThread(t.thread.clientId, t.thread.bidId);
        else if (t.clientId) goDocs(t.clientId);
        else { state.screen = t.go; render(); }
      });
    });
    $all('[data-activity]').forEach(function(el){
      el.addEventListener('click', function(){
        var a = (window.__activityList || [])[parseInt(el.getAttribute('data-activity'), 10)];
        if (a) goThread(a.clientId, a.bidId);
      });
    });

    // ---------------- Clients ----------------
    $all('[data-toggle-add]').forEach(function(el){ el.addEventListener('click', function(){ state.showAdd = !state.showAdd; render(); }); });
    $all('[data-save-client]').forEach(function(el){
      el.addEventListener('click', function(){
        var name = ($('#nc-name').value || '').trim();
        if (!name) { toast('Organisation name is required'); return; }
        var email = ($('#nc-email').value || '').trim();
        reloadAfter(sb.from('clients').insert({
          name: name, sector: ($('#nc-sector').value||'').trim() || null,
          contact_name: ($('#nc-contact').value||'').trim() || null, contact_email: email || null
        })).then(function(){
          state.showAdd = false; state.clientFilter = 'Active';
          toast(name + ' created' + (email ? ' · invite it from Portal access below' : ''));
        });
      });
    });
    $all('[data-cfilter]').forEach(function(el){ el.addEventListener('click', function(){ state.clientFilter = el.getAttribute('data-cfilter'); state.openClientId = null; render(); }); });
    $all('[data-toggle-client]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-toggle-client');
        state.openClientId = state.openClientId === id ? null : id;
        render();
      });
    });
    $all('[data-save-details]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-save-details');
        var name = ($('#ea-name-'+id).value || '').trim();
        if (!name) { toast('Organisation name cannot be empty'); return; }
        reloadAfter(sb.from('clients').update({
          name: name, sector: ($('#ea-sector-'+id).value||'').trim() || null,
          contact_name: ($('#ea-contact-'+id).value||'').trim() || null,
          contact_email: ($('#ea-email-'+id).value||'').trim() || null
        }).eq('id', id)).then(function(){ toast('Saved · logged to audit trail'); });
      });
    });
    $all('[data-archive]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-archive');
        var c = clientById(id);
        if (!c) return;
        patchClient(id, { archived: !c.archived, archived_at: c.archived ? null : new Date().toISOString() })
          .then(function(){ toast(c.archived ? c.name + ' restored' : c.name + ' archived'); });
      });
    });
    $all('[data-invite]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-invite');
        var to = ($('#inv-'+id).value || '').trim();
        if (!to || to.indexOf('@') < 0) { toast('Enter a valid email'); return; }
        patchClient(id, { contact_email: to }).then(function(){
          toast('Saved ' + to + ' — invite it from Supabase Authentication → Users, then link the id in Portal access');
        });
      });
    });
    $all('[data-add-note]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-add-note');
        var body = ($('#note-'+id).value || '').trim();
        if (!body) { toast('Note is empty'); return; }
        reloadAfter(sb.from('client_notes').insert({ client_id: id, body: body, author: adminName() }))
          .then(function(){ toast('Note added'); });
      });
    });
    $all('[data-jump]').forEach(function(el){
      el.addEventListener('click', function(){
        var parts = el.getAttribute('data-jump').split(':');
        if (parts[0] === 'documents') goDocs(parts[1]);
        else if (parts[0] === 'messages') goThread(parts[1], null);
        else if (parts[0] === 'bids') { state.screen = 'bids'; state.bq = nameOf(parts[1]); render(); }
      });
    });
    $all('[data-export-clients]').forEach(function(el){
      el.addEventListener('click', function(){
        var rows = [['Client','Sector','Contact','Email','Docs approved','Required','Open bids','Portal access','Status','Last activity']]
          .concat(state.clients.map(function(c){
            return [c.name, c.sector||'', c.contact_name||'', c.contact_email||'', approvedCount(c.id), REQ.length,
              state.bids.filter(function(b){return b.client_id===c.id;}).length, hasPortal(c.id)?'Yes':'No', c.archived?'Archived':'Active', c.created_at];
          }));
        download('marhana-clients.csv', csvEsc(rows));
        toast(state.clients.length + ' clients exported');
      });
    });
    liveSearch('cq', 'cq');

    // ---------------- Bids ----------------
    $all('[data-toggle-newbid]').forEach(function(el){
      el.addEventListener('click', function(){
        var live = state.clients.filter(function(c){ return !c.archived; });
        if (!live.length) { toast('Add a client first'); return; }
        state.showNewBid = !state.showNewBid;
        if (!state.newBid.clientId) state.newBid.clientId = live[0].id;
        render();
      });
    });
    $all('[data-save-bid]').forEach(function(el){
      el.addEventListener('click', function(){
        var clientId = $('#nb-client').value;
        var title = ($('#nb-title').value||'').trim();
        var deadline = $('#nb-deadline').value;
        if (!clientId) { toast('Pick a client'); return; }
        if (!title) { toast('Bid title is required'); return; }
        if (!deadline) { toast('Add a deadline'); return; }
        var valueGbp = Number(String($('#nb-value').value||'').replace(/[^0-9.]/g,'')) || 0;
        reloadAfter(sb.from('bids').insert({
          client_id: clientId, title: title, buyer: ($('#nb-buyer').value||'').trim() || null,
          deadline: deadline, value_gbp: valueGbp, value: money(valueGbp), stage: 0, sort: state.bids.length
        })).then(function(){
          state.showNewBid = false;
          toast(title + ' added to Opportunity');
        });
      });
    });
    $all('[data-bfilter]').forEach(function(el){ el.addEventListener('click', function(){ state.bidFilter = el.getAttribute('data-bfilter'); render(); }); });
    $all('[data-bidview]').forEach(function(el){ el.addEventListener('click', function(){ state.bidView = el.getAttribute('data-bidview'); render(); }); });
    $all('[data-bid-fwd]').forEach(function(el){ el.addEventListener('click', function(){ moveBid(el.getAttribute('data-bid-fwd'), 1); }); });
    $all('[data-bid-back]').forEach(function(el){ el.addEventListener('click', function(){ moveBid(el.getAttribute('data-bid-back'), -1); }); });
    $all('[data-open-bid]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-open-bid');
        var b = state.bids.filter(function(x){ return x.id === id; })[0];
        if (b) goThread(b.client_id, b.id);
      });
    });
    $all('[data-export-bids]').forEach(function(el){
      el.addEventListener('click', function(){
        var rows = [['Bid','Client','Buyer','Stage','Deadline','Value GBP','Outcome']]
          .concat(state.bids.map(function(b){ return [b.title, nameOf(b.client_id), b.buyer||'', STAGES[b.stage], b.deadline, b.value_gbp||0, b.outcome||'']; }));
        download('marhana-bids.csv', csvEsc(rows));
        toast('Pipeline exported');
      });
    });
    liveSearch('bq', 'bq');

    // ---------------- Messages ----------------
    $all('[data-toggle-newthread]').forEach(function(el){
      el.addEventListener('click', function(){
        var live = state.clients.filter(function(c){ return !c.archived; });
        state.newThread = !state.newThread;
        if (!state.ntClient) state.ntClient = live[0] ? live[0].id : '';
        state.ntBid = 'general';
        render();
      });
    });
    var ntClientSel = $('#nt-client');
    if (ntClientSel) ntClientSel.addEventListener('change', function(){ state.ntClient = ntClientSel.value; state.ntBid = 'general'; render(); });
    var ntBidSel = $('#nt-bid');
    if (ntBidSel) ntBidSel.addEventListener('change', function(){ state.ntBid = ntBidSel.value; });
    $all('[data-start-thread]').forEach(function(el){
      el.addEventListener('click', function(){
        var clientSel = $('#nt-client'), bidSel = $('#nt-bid');
        var clientId = clientSel ? clientSel.value : state.ntClient;
        var bidId = bidSel ? bidSel.value : state.ntBid;
        if (!clientId) { toast('Add a client first'); return; }
        goThread(clientId, bidId === 'general' ? null : bidId);
      });
    });
    $all('[data-mfilter]').forEach(function(el){ el.addEventListener('click', function(){ state.msgFilter = el.getAttribute('data-mfilter'); render(); }); });
    $all('[data-pick-thread]').forEach(function(el){
      el.addEventListener('click', function(){
        var key = el.getAttribute('data-pick-thread');
        state.threadKey = key; state.draft = '';
        markThread(key, true);
      });
    });
    $all('[data-toggle-thread-read]').forEach(function(el){
      el.addEventListener('click', function(){
        var threads = threadsFrom();
        var t = threads.filter(function(x){ return x.key === state.threadKey; })[0];
        if (t) markThread(t.key, !t.unread);
      });
    });
    $all('[data-open-bid-from-thread]').forEach(function(el){
      el.addEventListener('click', function(){
        var b = state.bids.filter(function(x){ return x.id === el.getAttribute('data-open-bid-from-thread'); })[0];
        state.screen = 'bids'; state.bq = b ? b.title : ''; render();
      });
    });
    var draftEl = $('#draft');
    if (draftEl) draftEl.addEventListener('keydown', function(e){ if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); state.draft = draftEl.value; sendMessage(); } });
    $all('[data-send-msg]').forEach(function(el){
      el.addEventListener('click', function(){
        var d = $('#draft');
        state.draft = d ? d.value : state.draft;
        sendMessage();
      });
    });
    $all('[data-mark-all-read]').forEach(function(el){
      el.addEventListener('click', function(){
        var unreadIds = state.messages.filter(function(m){ return m.from_client && !m.read_at; }).map(function(m){ return m.id; });
        if (!unreadIds.length) { toast('Nothing to mark'); return; }
        reloadAfter(sb.from('messages').update({ read_at: new Date().toISOString() }).in('id', unreadIds))
          .then(function(){ toast('All threads marked read'); });
      });
    });
    liveSearch('mq', 'mq');

    // ---------------- Documents ----------------
    $all('[data-dfilter]').forEach(function(el){ el.addEventListener('click', function(){ state.docFilter = el.getAttribute('data-dfilter'); render(); }); });
    $all('[data-goto-doc-client]').forEach(function(el){ el.addEventListener('click', function(){ goDocs(el.getAttribute('data-goto-doc-client')); }); });
    $all('[data-back-to-docs]').forEach(function(el){ el.addEventListener('click', function(){ state.docClientId = null; state.rejecting = null; render(); }); });
    $all('[data-chase-all]').forEach(function(el){
      el.addEventListener('click', function(){
        var attn = docAttention();
        var n = attn.filter(function(r){ return r.st === 'expired' || r.st === 'expiring'; }).length;
        toast('Reminders queued for ' + n + ' expiring items');
      });
    });
    $all('[data-attn-primary]').forEach(function(el){
      el.addEventListener('click', function(){
        var kind = el.getAttribute('data-attn-kind');
        var clientId = el.getAttribute('data-attn-client');
        if (kind === 'review') goDocs(clientId);
        else { var c = clientById(clientId); toast('Reminder sent to ' + (c ? (c.contact_name||c.name) : 'client')); }
      });
    });
    $all('[data-request-missing]').forEach(function(el){
      el.addEventListener('click', function(){
        var c = clientById(state.docClientId);
        toast('Request sent to ' + (c ? (c.contact_name||c.name) : ''));
      });
    });
    $all('[data-doc-message]').forEach(function(el){
      el.addEventListener('click', function(){ if (state.docClientId) goThread(state.docClientId, null); });
    });
    $all('[data-doc-approve]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-doc-approve');
        var d = state.documents.filter(function(x){ return x.id === id; })[0];
        setDocStatus(state.docClientId, id, 'approved', { review_note: null }, (d?d.name:'Document') + ' approved');
      });
    });
    $all('[data-doc-reject]').forEach(function(el){
      el.addEventListener('click', function(){ state.rejecting = el.getAttribute('data-doc-reject'); state.note = ''; render(); });
    });
    $all('[data-doc-cancel-reject]').forEach(function(el){ el.addEventListener('click', function(){ state.rejecting = null; state.note = ''; render(); }); });
    $all('[data-doc-confirm-reject]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-doc-confirm-reject');
        var noteEl = $('#reject-note');
        var note = noteEl ? noteEl.value.trim() : '';
        var c = clientById(state.docClientId);
        setDocStatus(state.docClientId, id, 'missing', { expiry_date: null, review_note: note || null }, 'Rejected — ' + (c ? (c.contact_name||c.name) : 'client') + ' notified');
      });
    });
    $all('[data-doc-receive]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-doc-receive');
        var d = state.documents.filter(function(x){ return x.id === id; })[0];
        setDocStatus(state.docClientId, id, 'pending', { expiry_date: null }, (d?d.name:'Document') + ' logged — ready to review');
      });
    });
    $all('[data-doc-chase]').forEach(function(el){
      el.addEventListener('click', function(){
        var c = clientById(state.docClientId);
        toast('Reminder sent to ' + (c ? (c.contact_name||c.name) : 'client'));
      });
    });
    $all('[data-doc-view]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-doc-view');
        var d = state.documents.filter(function(x){ return x.id === id; })[0];
        toast('Opening ' + (d ? slug(d.name) + '-2026.pdf' : 'document'));
      });
    });
    liveSearch('docq', 'docq');
  }
})();
</script>
</body>
</html>
